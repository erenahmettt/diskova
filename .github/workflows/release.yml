name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (for a manual run)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - name: Build for release
        run: |
          xcodebuild build \
            -project Diskova.xcodeproj \
            -scheme Diskova \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData

      - name: Package
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="${{ inputs.tag }}"
            VERSION="${VERSION#v}"
          fi
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            DerivedData/Build/Products/Release/Diskova.app \
            "dist/Diskova-$VERSION.zip"
          # Generated from inside dist/ so the checksum file names the archive
          # alone. With a path in it, `shasum -c` would look for `dist/...`
          # next to wherever the user downloaded the two files, and fail.
          ( cd dist && shasum -a 256 "Diskova-$VERSION.zip" > "Diskova-$VERSION.zip.sha256" )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cat "dist/Diskova-$VERSION.zip.sha256"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
          body: |
            ## Installing

            Unzip and drag `Diskova.app` to `/Applications`.

            This build is **ad-hoc signed and not notarised** — notarising needs
            a paid Apple Developer account — so macOS will refuse the first
            launch. Right-clicking and choosing *Open* no longer helps; Apple
            removed that bypass in macOS 15. Do one of these instead:

            **Clear the quarantine flag before opening it:**

            ```
            xattr -dr com.apple.quarantine /Applications/Diskova.app
            ```

            **Or** open Diskova, let it be blocked, then go to
            **System Settings › Privacy & Security**, scroll to *Security*, and
            click **Open Anyway**. Do it soon after the blocked launch — the
            button does not stay there indefinitely.

            ## Verifying this download

            ```
            shasum -a 256 -c Diskova-<version>.zip.sha256
            ```

            The archive is built by GitHub Actions from the tagged commit, so
            the path from source to binary is public. If you would rather not
            run an unsigned binary at all, building from source needs no Apple
            account and takes about thirty seconds.
